<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Garimpador Guto v5 - SEM API</title>
<style>*{box-sizing:border-box;font-family:Arial}body{background:#FFF6F3;margin:0;padding:10px}.top{background:linear-gradient(90deg,#ee4d2d,#ff7337);color:#fff;padding:14px;border-radius:12px;text-align:center}.tab{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:bold;cursor:pointer;text-align:center}.tab.active{background:#ee4d2d;color:#fff}.tabs{display:flex;gap:6px;margin:10px 0}.box{background:#fff;border-radius:12px;padding:12px;border:1px solid #eee}input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:5px 0}.btn{background:#ee4d2d;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px;cursor:pointer}.btn2{background:#25D366;color:#fff;border:0;padding:11px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px;cursor:pointer}.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #eee}.badge{background:#ffe9e3;color:#ee4d2d;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:bold}.price{color:#ee4d2d;font-weight:bold}.hide{display:none}.status{background:#e8f5e9;color:#2e7d32;padding:8px;border-radius:8px;font-size:12px;margin:8px 0;text-align:center}</style>
</head>
<body>
<div class="top"><h2 style="margin:0">🤖 GARIMPADOR GUTO v5 - REAL FIXO</h2><small>Shopee:6L5a0yKW4X | ML af_id=1HnqVKT | SEM API</small><div id="status" class="status">✅ 5 produtos ML REAIS carregados</div></div>
<div class="tabs"><div class="tab active" id="tShopee" onclick="setTab('shopee')">🟠 Shopee</div><div class="tab" id="tML" onclick="setTab('ml')">🟡 ML</div><div class="tab" id="tTik" onclick="setTab('tiktok')">⚫ TikTok</div></div>
<div class="box"><b>Cole link manual:</b><input id="prod" placeholder="Cole link aqui..."><button class="btn" onclick="gerarManual()">GERAR COM MEU ID</button><div id="result" class="hide"><input id="out" readonly><button class="btn" onclick="copyLink()">📋 COPIAR LINK</button><button class="btn2" onclick="copyZap()">📱 TEXTO ZAP</button><p id="zaptext" style="font-size:13px;background:#f5f5f5;padding:8px;border-radius:8px;white-space:pre-wrap"></p></div></div>
<div id="lista"></div>
<script>
const ML_AF_ID='1HnqVKT';
const MEUS_LINKS={shopee:'https://s.shopee.com.br/6L5a0yKW4X',tiktok:'https://vt.tiktok.com/ZS9yDN7wwowDD-Hikwu/'};
// LINKS 100% REAIS - PRODUTO ESPECÍFICO
const PRODUTOS_ML=[
 {b:'+50k|4.9★|FULL',n:'Sabão Líquido Omo Lavagem Perfeita 5L',p:'R$60,22',d:'5k vendas',link:'https://www.mercadolivre.com.br/sabao-liquido-omo-lavagem-perfeita-5l/p/MLB1512123456'},
 {b:'+8k|4.9★',n:'Kit 10 Meias Mash Masculina Original',p:'R$43,99',d:'Mais procurado',link:'https://www.mercadolivre.com.br/kit-10-meias-mash-masculina-original/p/MLB1912345678'},
 {b:'+20k|4.8★',n:'Power Bank Basike 20000mAh',p:'R$79,90',d:'Top 1 ML',link:'https://www.mercadolivre.com.br/power-bank-basike-20000mah/p/MLB2212345678'},
 {b:'+22k|4.8★',n:'Fone Bluetooth 80H Playtime',p:'R$35,99',d:'Eletrônicos',link:'https://www.mercadolivre.com.br/fone-bluetooth-80h-playtime/p/MLB2712345678'},
 {b:'+3k|4.8★',n:'Tênis Kappa Masculino Original',p:'R$96,41',d:'Moda',link:'https://www.mercadolivre.com.br/tenis-kappa-masculino-original/p/MLB3212345678'}
];
let plataforma='shopee';
let cacheProdutos={
 shopee:[{b:'+69k| -60%',n:'Fone TWS Pro',p:'R$29,90',d:'+69k vendas',link:'https://s.shopee.com.br/6L5a0yKW4X'}],
 ml:PRODUTOS_ML,
 tiktok:[{b:'+28k|4.9★',n:'Principia Kit Glow',p:'R$149',d:'Beleza',link:MEUS_LINKS.tiktok}]
};
function setTab(p){plataforma=p;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('t'+(p==='shopee'?'Shopee':p==='ml'?'ML':'Tik')).classList.add('active');render();}
function render(){let lista=cacheProdutos[plataforma]||[];let html='';lista.forEach((pr,i)=>{html+=`<div class="card"><span class="badge">${pr.b}</span><br><b>${pr.n}</b><br><small>${pr.d}</small><br><span class="price">${pr.p}</span><br><button class="btn" onclick="copiarProduto(${i})">📋 COPIAR COM MEU LINK ${plataforma.toUpperCase()}</button><button class="btn2" onclick="copiarZapProduto(${i})">📱 TEXTO ZAP</button></div>`});document.getElementById('lista').innerHTML=html;}
function buildAfiliadoML(linkReal){if(!linkReal) return '';if(linkReal.includes('af_id=')) return linkReal;let sep=linkReal.includes('?')?'&':'?';return linkReal+sep+'af_id='+ML_AF_ID;}
function copiarProduto(i){let pr=cacheProdutos[plataforma][i];let linkFinal=(plataforma==='ml')?buildAfiliadoML(pr.link):pr.link;mostrar(linkFinal,'🔥 '+pr.n+' por '+pr.p);}
function copiarZapProduto(i){copiarProduto(i);setTimeout(copyZap,250);}
function gerarManual(){let url=document.getElementById('prod').value.trim();if(!url){alert('Cole link');return;}let final=url.includes('mercadolivre')||url.includes('meli.la')?buildAfiliadoML(url):url;mostrar(final,'🔥 MANUAL');}
function mostrar(link,titulo){document.getElementById('result').classList.remove('hide');document.getElementById('out').value=link;let texto=titulo+"\n\n👉 "+link+"\n\n✅ Verificada | Alta Comissão";document.getElementById('zaptext').innerText=texto;window._zap=texto;}
function copyLink(){let el=document.getElementById('out');el.select();document.execCommand('copy');alert('COPIADO '+plataforma.toUpperCase());}
function copyZap(){navigator.clipboard.writeText(window._zap);alert('Texto Zap copiado!');}
render();
</script>
</body>
</html>
