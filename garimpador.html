<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garimpador Guto - 3 em 1</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#FFF6F3;margin:0;padding:10px}
.top{background:linear-gradient(90deg,#ee4d2d,#ff7337);color:#fff;padding:14px;border-radius:12px;text-align:center}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:bold;cursor:pointer;text-align:center}
.tab.active{background:#ee4d2d;color:#fff;border-color:#ee4d2d}
.box{background:#fff;border-radius:12px;padding:12px;border:1px solid #eee}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0}
.btn{background:#ee4d2d;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px}
.btn2{background:#25D366;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #eee}
.badge{background:#ffe9e3;color:#ee4d2d;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:bold}
.hide{display:none}
</style>
</head>
<body>
<div class="top">
<h2 style="margin:0">🔥 GARIMPADOR DO GUTO 3 EM 1 🔥</h2>
<small>Shopee: 6L5a0yKW4X | ML: 1HnqVKT | TikTok: Afiliado</small>
</div>
<div class="tabs">
<div class="tab active" id="tShopee" onclick="setTab('shopee')">🟠 Shopee</div>
<div class="tab" id="tML" onclick="setTab('ml')">🟡 Mercado Livre</div>
<div class="tab" id="tTik" onclick="setTab('tiktok')">⚫ TikTok Shop</div>
</div>
<div class="box">
<b id="label">Cole link de QUALQUER produto Shopee:</b>
<input id="prod" placeholder="Cole aqui o link...">
<button class="btn" onclick="gerar()">GERAR E COPIAR MEU LINK AFILIADO</button>
<div id="result" class="hide" style="margin-top:12px">
<input id="out" readonly>
<button class="btn" onclick="copyLink()">📋 COPIAR LINK AFILIADO</button>
<button class="btn2" onclick="copyZap()">📱 COPIAR TEXTO P/ ZAP</button>
<p id="zaptext" style="font-size:13px;background:#f5f5f5;padding:10px;border-radius:8px;white-space:pre-wrap"></p>
</div>
</div>
<h3>💣 Requisitos: +1k vendas | -30% | 4.8★+</h3>
<div class="card"><span class="badge">+8.2k | -60% | 4.9★</span><br><b>Fone Bluetooth TWS R$29,90</b><br><button class="btn" onclick="exemplo('🟠 Fone TWS R$29,90 - 8.2k vendidos 4.9★')">📋 COPIAR COM MEU ID</button></div>
<div class="card"><span class="badge">+5.5k | -45% | 4.8★</span><br><b>Smartwatch D20 R$69,90</b><br><button class="btn" onclick="exemplo('⌚ Smartwatch D20 R$69,90 - TOP vendido')">📋 COPIAR COM MEU ID</button></div>
<script>
let plataforma='shopee';
const LINKS={shopee:'https://s.shopee.com.br/6L5a0yKW4X',ml:'https://meli.la/1HnqVKT',tiktok:''};
function setTab(p){
 plataforma=p;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 if(p==='shopee'){document.getElementById('tShopee').classList.add('active');document.getElementById('label').innerText='Cole link de QUALQUER produto Shopee:';}
 if(p==='ml'){document.getElementById('tML').classList.add('active');document.getElementById('label').innerText='Cole link de QUALQUER produto Mercado Livre:';}
 if(p==='tiktok'){document.getElementById('tTik').classList.add('active');document.getElementById('label').innerText='Cole link de QUALQUER produto TikTok Shop:';}
}
function gerar(){
 let url=document.getElementById('prod').value.trim();
 if(!url){alert('Cole o link');return;}
 let finalLink=plataforma==='shopee'?LINKS.shopee:plataforma==='ml'?LINKS.ml:url;
 mostrar(finalLink,'🔥 ACHADINHO GARIMPADO');
}
function exemplo(titulo){
 let link=plataforma==='shopee'?LINKS.shopee:plataforma==='ml'?LINKS.ml:'https://vt.tiktok.com/ZS9yDN7wwowDD-Hikwu/';
 mostrar(link,titulo);
}
function mostrar(link,titulo){
 document.getElementById('result').classList.remove('hide');
 document.getElementById('out').value=link;
 let texto=titulo+"\n\n👉 "+link+"\n\n✅ +1k vendidos | ✅ 4.8★ | ✅ Desconto real";
 document.getElementById('zaptext').innerText=texto;
 window._zap=texto;
 copyLink();
 window.scrollTo(0,0);
}
function copyLink(){
 let el=document.getElementById('out');el.select();document.execCommand('copy');
 alert('✅ COPIADO '+plataforma.toUpperCase());
}
function copyZap(){navigator.clipboard.writeText(window._zap);alert('Texto Zap copiado!');}
</script>
</body>
</html>
