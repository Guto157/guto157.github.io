<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garimpador v8 - 3 Plataformas</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#0f0f0f;color:#fff;margin:0;padding:10px}
.header{background:#ff2d55;padding:15px;border-radius:12px;text-align:center;font-weight:bold;font-size:18px}
.config{background:#1e1e1e;padding:12px;border-radius:12px;margin:12px 0;border:1px solid #333}
.config input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
.tabs{display:flex;gap:6px;margin:10px 0}.tab{flex:1;padding:12px;border-radius:10px;background:#1e1e1e;text-align:center;font-weight:bold;cursor:pointer}
.tab.active{background:#ff2d55}.card{background:#1e1e1e;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #333}
.badge{background:#00c851;color:#fff;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:bold}
.price{color:#00ff88;font-weight:bold;font-size:16px}.btn{width:100%;padding:12px;border-radius:8px;border:0;font-weight:bold;margin-top:6px;cursor:pointer}
.btn-ml{background:#ffe600;color:#000}.btn-shopee{background:#ee4d2d;color:#fff}.btn-tiktok{background:#000;color:#fff;border:1px solid #fff}
small{color:#aaa;word-break:break-all}
</style>
</head>
<body>
<div class="header">🤖 GARIMPADOR AUTOMÁTICO v8<br><small>TOP VENDAS + ALTA COMISSÃO</small></div>

<div class="config">
<b>⚙️ SEUS IDs DE AFILIADO (edita uma vez só):</b><br>
ML af_id: <input id="mlid" value="2DVBaXN">
Shopee ID: <input id="shopeeid" value="6L5a0yKW4X">
TikTok Shop ID: <input id="tiktokid" value="SEU_ID_TIKTOK_AQUI">
<button class="btn" style="background:#00c851;color:#fff" onclick="salvar()">💾 SALVAR IDs</button>
</div>

<div class="tabs">
<div class="tab active" id="tML" onclick="setTab('ml')">🟡 ML</div>
<div class="tab" id="tShopee" onclick="setTab('shopee')">🟠 Shopee</div>
<div class="tab" id="tTiktok" onclick="setTab('tiktok')">⚫ TikTok</div>
</div>
<div id="lista"></div>

<script>
let mlid = localStorage.getItem('mlid') || '2DVBaXN';
let shopeeid = localStorage.getItem('shopeeid') || '6L5a0yKW4X';
let tiktokid = localStorage.getItem('tiktokid') || '';
document.getElementById('mlid').value = mlid;
document.getElementById('shopeeid').value = shopeeid;
document.getElementById('tiktokid').value = tiktokid;

function salvar(){
 mlid=document.getElementById('mlid').value;
 shopeeid=document.getElementById('shopeeid').value;
 tiktokid=document.getElementById('tiktokid').value;
 localStorage.setItem('mlid',mlid);localStorage.setItem('shopeeid',shopeeid);localStorage.setItem('tiktokid',tiktokid);
 alert('IDs salvos! Agora o botão copiar já vai com sua comissão'); render();
}

const PRODUTOS = {
 ml: [
  {rank:'#1 TOP',sales:'+50k',rating:'4.9★',comm:'Alta',nome:'Omo Líquido 5L - Lavagem Perfeita',preco:'R$60,22',linkBase:'https://www.mercadolivre.com.br/omo-liquido-lavagem-perfeita-5l'},
  {rank:'#2 TOP',sales:'+10k',rating:'4.9★',comm:'Alta',nome:'Kit 10 Meias Mash Original',preco:'R$43,99',linkBase:'https://www.mercadolivre.com.br/meias-mash-kit-10-pares'},
  {rank:'#3 TOP',sales:'+22k',rating:'4.8★',comm:'Alta',nome:'Fone Bluetooth 80H Bateria',preco:'R$35,99',linkBase:'https://www.mercadolivre.com.br/fone-bluetooth-80h'}
 ],
 shopee: [
  {rank:'#1 TOP',sales:'+69k',rating:'4.9★',comm:'20%',nome:'Fone TWS com Estojo - Alta Comissão',preco:'R$29,90',linkBase:'https://s.shopee.com.br/6L5a0yKW4X'},
  {rank:'#2 TOP',sales:'+28k',rating:'4.9★',comm:'18%',nome:'Kit Principia Glow - Top Beleza',preco:'R$149,00',linkBase:'https://s.shopee.com.br/7fL5a0yKW4X'}
 ],
 tiktok: [
  {rank:'#1 VIRAL',sales:'+15k',rating:'4.8★',comm:'15%',nome:'Mini Projetor Portátil - Viral TikTok',preco:'R$129,90',linkBase:'https://vt.tiktok.com/ZS...'},
  {rank:'#2 VIRAL',sales:'+9k',rating:'4.9★',comm:'22%',nome:'Escova Secadora 5 em 1',preco:'R$89,90',linkBase:'https://vt.tiktok.com/ZS...'}
 ]
};

let plat='ml';
function setTab(p){plat=p;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('t'+(p==='ml'?'ML':p.charAt(0).toUpperCase()+p.slice(1))).classList.add('active');render();}

function converterLink(prod){
 if(plat==='ml'){return prod.linkBase + (prod.linkBase.includes('?')?'&':'?') + 'af_id=' + mlid;}
 if(plat==='shopee'){return prod.linkBase;}
 if(plat==='tiktok'){if(!tiktokid){return prod.linkBase;} return prod.linkBase + (prod.linkBase.includes('?')?'&':'?') + 'affiliate_id=' + tiktokid;}
}

function render(){
 let html=''; PRODUTOS[plat].forEach(p=>{
  let finalLink = converterLink(p);
  let textoZap = `🔥 ${p.nome} - ${p.preco}\n${p.rank} | ${p.sales} vendas | ${p.rating}\n👉 ${finalLink}`;
  html+=`<div class="card"><span class="badge">${p.rank} | ${p.sales} | ${p.rating} | Comissão: ${p.comm}</span><br><b>${p.nome}</b><br><span class="price">${p.preco}</span><br><small>${finalLink}</small><br>
  <button class="btn ${plat==='ml'?'btn-ml':plat==='shopee'?'btn-shopee':'btn-tiktok'}" onclick="navigator.clipboard.writeText('${finalLink}').then(()=>alert('LINK COM SUA COMISSÃO COPIADO:\\n'+finalLink))">📋 COPIAR LINK COM MINHA COMISSÃO (${plat==='ml'?mlid:plat==='shopee'?shopeeid:tiktokid||'ID'})</button>
  <button class="btn" style="background:#25D366;color:#fff" onclick="navigator.clipboard.writeText(\`${textoZap}\`).then(()=>alert('TEXTO ZAP COPIADO'))">📱 COPIAR TEXTO ZAP</button>
  </div>`;
 });
 document.getElementById('lista').innerHTML=html;
}
render();
</script>
</body>
</html>
