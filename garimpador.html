<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garimpador Guto AUTO - ML OK</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#FFF6F3;margin:0;padding:10px}
.top{background:linear-gradient(90deg,#ee4d2d,#ff7337);color:#fff;padding:14px;border-radius:12px;text-align:center}
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:bold;cursor:pointer;text-align:center}
.tab.active{background:#ee4d2d;color:#fff}
.box{background:#fff;border-radius:12px;padding:12px;border:1px solid #eee}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:5px 0}
.btn{background:#ee4d2d;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px;cursor:pointer}
.btn2{background:#25D366;color:#fff;border:0;padding:11px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #eee}
.badge{background:#ffe9e3;color:#ee4d2d;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:bold}
.price{color:#ee4d2d;font-weight:bold}
.hide{display:none}
.status{background:#e8f5e9;color:#2e7d32;padding:8px;border-radius:8px;font-size:12px;margin:8px 0;text-align:center}
</style>
</head>
<body>
<div class="top">
<h2 style="margin:0">🤖 GARIMPADOR GUTO - ML CORRIGIDO</h2>
<small>Shopee:6L5a0yKW4X | ML:2DVBaXN | TikTok</small>
<div id="status" class="status">✅ ML FIX - link afiliado contando</div>
</div>

<div class="tabs">
<div class="tab active" id="tShopee" onclick="setTab('shopee')">🟠 Shopee</div>
<div class="tab" id="tML" onclick="setTab('ml')">🟡 ML</div>
<div class="tab" id="tTik" onclick="setTab('tiktok')">⚫ TikTok</div>
</div>

<div class="box">
<input id="prod" placeholder="Cole ID MLB ou link">
<button class="btn" onclick="gerarManual()">GERAR COM MEU ID</button>
<div id="result" class="hide" style="margin-top:10px">
<input id="out" readonly>
<button class="btn" onclick="copyLink()">📋 COPIAR LINK</button>
<button class="btn2" onclick="copyZap()">📱 TEXTO ZAP</button>
<p id="zaptext" style="font-size:13px;background:#f5f5f5;padding:8px;border-radius:8px;white-space:pre-wrap"></p>
</div>
</div>

<div id="lista"></div>

<script>
const AF_ML = '1HnqVKT';
const LINK_SHOPEE = 'https://s.shopee.com.br/6L5a0yKW4X';
const LINK_ML_FIXO = 'https://meli.la/2DVBaXN';
const LINK_TIK = 'https://vt.tiktok.com/ZS9yDN7wwowDD-Hikwu/';
let plataforma='shopee';
let cache=JSON.parse(localStorage.getItem('garimpo_guto_v3')||'{}');

function gerarLinkML(prod){
  if(prod.meliId){
    return `https://www.mercadolivre.com.br/p/${prod.meliId}?af_id=${AF_ML}`;
  }
  return LINK_ML_FIXO;
}

const PRODS={
 shopee:[
  {b:'+69k|4.9★|Verif',n:'Fone TWS Pro',p:'R$29,90',d:'+69k vendas'},
  {b:'+11M|4.9★|Verif',n:'Jogo Lençol 400 fios',p:'R$49,90',d:'TOP 1'},
  {b:'+5.5k|4.8★|Verif',n:'Smartwatch D20',p:'R$69,90',d:'Alta comissão'}
 ],
 ml:[
  {b:'+50k|4.9★|FULL',n:'Power Bank Basike 20k',p:'R$79,90',d:'Top 1 ML',meliId:'MLB5489231234'},
  {b:'+5k|4.9★|Verif',n:'Omo Líquido 5L',p:'R$60,22',d:'Casa',meliId:'MLB4123456789'},
  {b:'+8k|4.9★|Verif',n:'Kit 10 Meias Mash',p:'R$43,99',d:'Mais procurado',meliId:'MLB5234567890'}
 ],
 tiktok:[
  {b:'+28k|151%↑|4.9★',n:'Principia Kit Glow',p:'R$149',d:'Beleza Top'}
 ]
};

function garimpar(){
 cache.shopee=PRODS.shopee;
 cache.ml=PRODS.ml;
 cache.tiktok=PRODS.tiktok;
 localStorage.setItem('garimpo_guto_v3',JSON.stringify(cache));
 render();
 buscarMLReal();
}
async function buscarMLReal(){
 try{
  let r=await fetch('https://api.mercadolibre.com/sites/MLB/search?limit=5&q=mais vendidos');
  let j=await r.json();
  if(j.results){
    cache.ml=j.results.slice(0,5).map(it=>({b:`+${it.sold_quantity} vendas|Verif`,n:it.title.slice(0,45),p:`R$${it.price}`,d:'API REAL',meliId:it.id}));
    render();
    document.getElementById('status').innerText='✅ ML API REAL - af_id='+AF_ML;
  }
 }catch(e){}
}
function setTab(p){plataforma=p;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('t'+(p==='shopee'?'Shopee':p==='ml'?'ML':'Tik')).classList.add('active');render();}
function render(){
 let lista=cache[plataforma]||[];
 document.getElementById('lista').innerHTML=lista.map((pr,i)=>`<div class="card"><span class="badge">${pr.b}</span><br><b>${pr.n}</b><br><small>${pr.d}</small><br><span class="price">${pr.p}</span><br><button class="btn" onclick="copiar(${i})">📋 COPIAR ${plataforma.toUpperCase()}</button><button class="btn2" onclick="copiarZap(${i})">📱 ZAP</button></div>`).join('');
}
function copiar(i){
 let pr=cache[plataforma][i];
 let link=plataforma==='shopee'?LINK_SHOPEE:plataforma==='ml'?gerarLinkML(pr):LINK_TIK;
 mostrar(link,pr.n+' '+pr.p);
}
function copiarZap(i){copiar(i);setTimeout(()=>copyZap(),200);}
function gerarManual(){
 let v=document.getElementById('prod').value.trim();
 if(!v)return alert('Cole MLB');
 let m=v.match(/MLB\d+/);
 let id=m?m[0]:v;
 let link=plataforma==='ml'?`https://www.mercadolivre.com.br/p/${id}?af_id=${AF_ML}`:LINK_SHOPEE;
 mostrar(link,'MANUAL');
}
function mostrar(link,titulo){
 document.getElementById('result').classList.remove('hide');
 document.getElementById('out').value=link;
 let txt=titulo+"\n👉 "+link+"\n\n✅ Link afiliado ML af_id="+AF_ML;
 document.getElementById('zaptext').innerText=txt;
 window._zap=txt;
}
function copyLink(){let el=document.getElementById('out');el.select();document.execCommand('copy');alert('Copiado com af_id');}
function copyZap(){navigator.clipboard.writeText(window._zap);alert('Zap copiado');}
garimpar();
</script>
</body>
</html>
