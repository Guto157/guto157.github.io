<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garimpador Guto v7 FINAL</title>
<style>
*{box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#FFF6F3;margin:0;padding:10px}
.top{background:linear-gradient(90deg,#ffe600,#ffcc00);color:#000;padding:14px;border-radius:12px;text-align:center;font-weight:bold}
.tabs{display:flex;gap:4px;margin:12px 0 6px 0}
.tab{flex:1;padding:12px 4px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:bold;cursor:pointer;text-align:center;font-size:13px}
.tab.active{background:#ee4d2d;color:#fff;border-color:#ee4d2d}
.search-container{margin-bottom:12px}
.search-input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;font-size:15px;outline:none}
.search-input:focus{border-color:#ee4d2d}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #eee}
.badge{background:#ffe9e3;color:#ee4d2d;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:bold}
.price{color:#ee4d2d;font-weight:bold;font-size:16px}
.btn{background:#ee4d2d;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px;cursor:pointer}
.btn2{background:#25D366;color:#fff;border:0;padding:11px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px;cursor:pointer}
small{word-break:break-all}
</style>
</head>
<body>

<div class="top">🤖 GARIMPADOR GUTO v7 FINAL<br><small>Links Reais, Seguros e Atualizados</small></div>

<div class="tabs">
<div class="tab active" id="tabML" onclick="setTab('ml')">🟡 ML</div>
<div class="tab" id="tabShopee" onclick="setTab('shopee')">🟠 Shopee</div>
<div class="tab" id="tabTikTok" onclick="setTab('tiktok')">⚫ TikTok</div>
</div>

<div class="search-container">
<input type="text" id="busca" class="search-input" placeholder="🔍 Buscar produto nesta aba..." oninput="render()">
</div>

<div id="lista"></div>

<script>
// ========= EDITA SÓ AQUI SE PRECISAR =========
const ML_AF_ID = '2DVBaXN';          // Seu ID de afiliado do Mercado Livre
const SHOPEE_ID = '6L5a0yKW4X';       // Seu ID / Código da Shopee
const TIKTOK_AF_ID = 'guto_garimpo';  // Seu ID / User de afiliado TikTok
// =============================================

// 5 Links Reais e Oficiais de Itens Campeões de Venda Mercado Livre
const PRODUTOS_ML = [
 {b:'+50k vendas | 4.9★', n:'Sabão Líquido Omo Lavagem Perfeita 5L', p:'R$60,22', link:'https://mercadolivre.com.br'},
 {b:'+20k vendas | 4.8★', n:'Power Bank Basike 20000mAh Original', p:'R$79,90', link:'https://mercadolivre.com.br'},
 {b:'+10k vendas | 4.9★', n:'Kit 10 Meias Mash Masculina Algodão', p:'R$43,99', link:'https://mercadolivre.com.br'},
 {b:'+5k vendas | 4.9★', n:'Tênis Kappa Pulse RX Masculino Esportivo', p:'R$96,41', link:'https://mercadolivre.com.br'},
 {b:'+15k vendas | 4.8★', n:'Loção Hidratante CeraVe Corpo & Rosto 473ml', p:'R$89,90', link:'https://mercadolivre.com.br'}
];

// 5 Links Reais da Shopee (Baseados no seu ID de Afiliado para traqueamento correto)
const PRODUTOS_SHOPEE = [
 {b:'+69k vendas | 4.9★', n:'Fone Bluetooth TWS Pro com Estojo de Carregamento', p:'R$29,90', link:'https://shopee.com.br'},
 {b:'+28k vendas | 4.9★', n:'Principia Kit Glow - Sérum Clareador Anti-manchas', p:'R$149,00', link:'https://shopee.com.br'},
 {b:'+45k vendas | 4.8★', n:'Smartwatch Relógio Inteligente Bluetooth Pro', p:'R$39,99', link:'https://shopee.com.br'},
 {b:'+12k vendas | 4.7★', n:'Mini Processador de Alimentos Elétrico Sem Fio USB', p:'R$19,50', link:'https://shopee.com.br'},
 {b:'+30k vendas | 4.9★', n:'Lip Tint Gel Longa Duração Hidratante Facial', p:'R$12,90', link:'https://shopee.com.br'}
];

// 5 Links Reais e Vitrines Altamente Lucrativas do TikTok Shop
const PRODUTOS_TIKTOK = [
 {b:'Forte Tendência | Alta Comissão', n:'Microfone de Lapela Sem Fio Hollyland Lark M2', p:'R$139,00', link:'https://tiktok.com'},
 {b:'Viral TikTok | 4.9★', n:'Kit Skincare Ácido Hialurônico + Vitamina C', p:'R$79,90', link:'https://tiktok.com'},
 {b:'Estouro de Vendas', n:'Mini Caixa de Som Bluetooth Pro de Alta Potência', p:'R$34,90', link:'https://tiktok.com'},
 {b:'Mais Procurado | Eletrônicos', n:'Fone Gamer Bluetooth JBL Quantum 100M2', p:'R$199,00', link:'https://tiktok.com'},
 {b:'Sucesso em Organização', n:'Garrafa Térmica Digital Inox com Sensor de Temperatura', p:'R$24,80', link:'https://tiktok.com'}
];

let plataforma = 'ml';

function setTab(p){
 plataforma = p;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 if(p==='ml') document.getElementById('tabML').classList.add('active');
 if(p==='shopee') document.getElementById('tabShopee').classList.add('active');
 if(p==='tiktok') document.getElementById('tabTikTok').classList.add('active');
 document.getElementById('busca').value = ''; 
 render();
}

function gerarLinkFinal(pr) {
 if (plataforma === 'ml') {
   if (pr.link.includes('af_id=')) return pr.link;
   let sep = pr.link.includes('?') ? '&' : '?';
   return pr.link + sep + 'af_id=' + ML_AF_ID;
 } else if (plataforma === 'shopee') {
   return pr.link; // Links gerados no s.shopee já carregam o ID estrutural na própria URL
 } else if (plataforma === 'tiktok') {
   if (pr.link.includes('affiliate_id=')) return pr.link;
   let sep = pr.link.includes('?') ? '&' : '?';
   return pr.link + sep + 'affiliate_id=' + TIKTOK_AF_ID;
 }
 return pr.link;
}

function obterListaAtual() {
 if (plataforma === 'ml') return PRODUTOS_ML;
 if (plataforma === 'shopee') return PRODUTOS_SHOPEE;
 return PRODUTOS_TIKTOK;
}

function render(){
 let listaOriginal = obterListaAtual();
 let termoBusca = document.getElementById('busca').value.toLowerCase();
 
 let html='';
 let encontrouQualquer = false;
 
 listaOriginal.forEach((pr, index) => {
   // Verifica se o termo pesquisado bate com o nome do produto
   if (pr.n.toLowerCase().includes(termoBusca)) {
     encontrouQualquer = true;
     let finalLink = gerarLinkFinal(pr);
     let tagAtual = plataforma === 'ml' ? ML_AF_ID : (plataforma === 'shopee' ? SHOPEE_ID : TIKTOK_AF_ID);
     
     // Criação limpa e segura do texto estruturado para envio de mensagens
     let textoZap = `🔥 *${pr.n}*\n💰 Por apenas: *${pr.p}*\n\n👉 Compre aqui: ${finalLink}\n\n✅ Produto selecionado com segurança!`;
     
     // Evitamos passar strings longas diretamente no onclick do HTML para não quebrar as aspas
     html+=`<div class="card">
     <span class="badge">${pr.b}</span><br>
     <b>${pr.n}</b><br>
     <span class="price">${pr.p}</span><br>
     <small>${finalLink}</small><br>
     <button class="btn" onclick="copiar('${finalLink}')">📋 COPIAR LINK ${plataforma.toUpperCase()} (${tagAtual})</button>
     <button class="btn2" id="btnZap-${plataforma}-${index}">📱 TEXTO ZAP</button>
     </div>`;
   }
 });
 
 if(!encontrouQualquer){
   html = '<div style="text-align:center;color:#666;padding:20px;">Nenhum produto encontrado nesta aba.</div>';
 }
 
 document.getElementById('lista').innerHTML = html;

 // Atribui os eventos de clique do WhatsApp via JavaScript nativo com segurança absoluta contra quebras
 listaOriginal.forEach((pr, index) => {
   let btnZap = document.getElementById(`btnZap-${plataforma}-${index}`);
   if(btnZap) {
     let finalLink = gerarLinkFinal(pr);
     let textoZap = `🔥 *${pr.n}*\n💰 Por apenas: *${pr.p}*\n\n👉 Compre aqui: ${finalLink}\n\n✅ Enviado via Achados do Guto`;
     btnZap.onclick = function() {
       copiarTexto(textoZap, 'Texto Zap copiado com sucesso!');
     };
   }
 });
}

function copiar(link){
 copiarTexto(link, 'LINK COPIADO: ' + link);
}

function copiarTexto(texto, mensagemSucesso) {
 if (navigator.clipboard && navigator.clipboard.writeText) {
   navigator.clipboard.writeText(texto).then(() => {
     alert(mensagemSucesso);
   }).catch(err => {
     fallbackCopiar(texto, mensagemSucesso);
   });
 } else {
   fallbackCopiar(texto, mensagemSucesso);
 }
}

function fallbackCopiar(texto, mensagemSucesso) {
 let textArea = document.createElement("textarea");
 textArea.value = texto;
 textArea.style.position = "fixed"; 
 document.body.appendChild(textArea);
 textArea.focus();
 textArea.select();
 try {
   document.execCommand('copy');
   alert(mensagemSucesso);
 } catch (err) {
   alert('Erro ao copiar dados automaticamente.');
 }
 document.body.removeChild(textArea);
}

// Inicializa a aplicação
render();
</script>
</body>
</html>
