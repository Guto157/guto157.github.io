<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garimpador Guto - AUTO 1x Dia</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#FFF6F3;margin:0;padding:10px}
.top{background:linear-gradient(90deg,#ee4d2d,#ff7337);color:#fff;padding:14px;border-radius:12px;text-align:center}
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:bold;cursor:pointer;text-align:center}
.tab.active{background:#ee4d2d;color:#fff}
.box{background:#fff;border-radius:12px;padding:12px;border:1px solid #eee}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:5px 0}
.btn{background:#ee4d2d;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px;cursor:pointer}
.btn2{background:#25D366;color:#fff;border:0;padding:11px;border-radius:8px;width:100%;font-weight:bold;margin-top:6px;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #eee}
.badge{background:#ffe9e3;color:#ee4d2d;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:bold}
.price{color:#ee4d2d;font-weight:bold}
.hide{display:none}
.status{background:#e8f5e9;color:#2e7d32;padding:8px;border-radius:8px;font-size:12px;margin:8px 0;text-align:center}
</style>
</head>
<body>
<div class="top">
<h2 style="margin:0">🤖 GARIMPADOR AUTO DO GUTO</h2>
<small>Shopee:6L5a0yKW4X | ML:1HnqVKT | TikTok Afiliado | Auto 1x/dia</small>
<div id="status" class="status" style="background:#fff;color:#ee4d2d;margin-top:8px">⏳ Verificando garimpo do dia...</div>
</div>

<div class="tabs">
<div class="tab active" id="tShopee" onclick="setTab('shopee')">🟠 Shopee</div>
<div class="tab" id="tML" onclick="setTab('ml')">🟡 ML</div>
<div class="tab" id="tTik" onclick="setTab('tiktok')">⚫ TikTok</div>
</div>

<div class="box">
<b id="label">Cole link manual (opcional):</b>
<input id="prod" placeholder="Cole link se quiser forçar...">
<button class="btn" onclick="gerarManual()">GERAR COM MEU ID</button>
<div id="result" class="hide" style="margin-top:10px">
<input id="out" readonly>
<button class="btn" onclick="copyLink()">📋 COPIAR LINK</button>
<button class="btn2" onclick="copyZap()">📱 TEXTO ZAP</button>
<p id="zaptext" style="font-size:13px;background:#f5f5f5;padding:8px;border-radius:8px;white-space:pre-wrap"></p>
</div>
</div>

<div id="lista"></div>

<script>
const MEUS_LINKS={shopee:'https://s.shopee.com.br/6L5a0yKW4X',ml:'https://meli.la/1HnqVKT',tiktok:'https://vt.tiktok.com/ZS9yDN7wwowDD-Hikwu/'};
let plataforma='shopee';
let cacheProdutos=JSON.parse(localStorage.getItem('garimpo_guto_cache')||'{}');
let ultimaData=localStorage.getItem('garimpo_guto_data');

// BANCO ROTATIVO - simula garimpo real todo dia (Shopee/TikTok API fechada sem app aprovado)
const BANCO={
 shopee:[
  [{b:'+69k| -60%|4.9★|Loja Verif',n:'Fone TWS Pro',p:'R$29,90',d:'+69k vendidos'},{b:'+11M buscas|4.9★|Verif',n:'Jogo Lençol 400 fios',p:'R$49,90',d:'TOP 1'},{b:'+5.5k| -45%|4.8★|Verif',n:'Smartwatch D20',p:'R$69,90',d:'Melhor comissão'},{b:'+50k| -35%|4.9★|Verif',n:'Air Fryer 4.2L',p:'R$199',d:'Casa'},{b:'+8k| -30%|4.8★|Verif',n:'Capinha Anti-impacto',p:'R$19,90',d:'Mais procurado'}],
  [{b:'+72k| -55%|4.9★|Verif',n:'Fone Bluetooth JBL Clone',p:'R$39,90',d:'Mais vendido'},{b:'+9M| -40%|4.8★|Verif',n:'Kit 3 Toalhas',p:'R$59,90',d:'Lar'},{b:'+6k| -50%|4.9★|Verif',n:'Mini Projetor',p:'R$129',d:'Alta comissão'},{b:'+40k| -38%|4.8★|Verif',n:'Escova Secadora',p:'R$89',d:'Beleza'},{b:'+12k| -33%|4.9★|Verif',n:'Suporte Celular Carro',p:'R$15,90',d:'Auto'}]
 ],
 ml:[
  [{b:'+50k|4.9★|Verif|FULL',n:'Power Bank Basike 20k',p:'R$79,90',d:'Top 1 ML'},{b:'+22k|4.8★|Verif',n:'Fone 80H',p:'R$35,99',d:'Eletrônicos'},{b:'+5k|4.9★|Verif',n:'Omo 5L',p:'R$60,22',d:'Casa'},{b:'+3k|4.8★|Verif',n:'Tênis Kappa',p:'R$96,41',d:'Moda'},{b:'+8k|4.9★|Verif',n:'Kit Meias Mash',p:'R$43,99',d:'Mais procurado'}]
 ],
 tiktok:[
  [{b:'+28k|151%↑|4.9★|Verif',n:'Principia Kit Glow',p:'R$149',d:'Beleza Top'},{b:'154%↑|4.8★|Verif',n:'Top Y2K Halter',p:'R$39,90',d:'Viral Moda'},{b:'+600k/mês|4.9★|Verif',n:'Shorts 3 por 1',p:'R$59,90',d:'Bundle'},{b:'+22k|4.8★|Verif',n:'Saia Boêmia',p:'R$69,90',d:'Verificada'},{b:'102x↑|4.9★|Verif',n:'Aspirador Homeika',p:'R$199',d:'CleanTok'}],
  [{b:'+30k|200%↑|4.9★|Verif',n:'Gloss Kylie',p:'R$29,90',d:'Beleza viral'},{b:'+100k|4.8★|Verif',n:'Legging Empina Bumbum',p:'R$49,90',d:'Moda'},{b:'+50k|4.9★|Verif',n:'Organizador Geladeira',p:'R$19,90',d:'Casa'},{b:'+15k|4.8★|Verif',n:'Luz LED TikTok',p:'R$39,90',d:'Criador'},{b:'+40k|4.9★|Verif',n:'Esponja Maquiagem',p:'R$12,90',d:'Mais procurado'}]
 ]
};

function getIndiceDiario(max){return new Date().getDate() % max;}

async function garimparAuto(){
 let hoje=new Date().toISOString().split('T')[0];
 let precisa=ultimaData!==hoje;
 document.getElementById('status').innerText=precisa?'🤖 Garimpando 5 de cada plataforma hoje...':'✅ Garimpo de hoje OK - '+hoje+' (atualiza amanhã)';

 if(precisa){
  // ML busca real via API pública
  try{
   let r=await fetch('https://api.mercadolibre.com/sites/MLB/search?sort=sold_quantity_desc&limit=5&q=mais vendidos');
   let j=await r.json();
   if(j.results){
    let lista=j.results.slice(0,5).map(it=>({b:`+${it.sold_quantity} vendas|${it.seller.power_seller_status? 'Verif':''}|4.8★`,n:it.title.slice(0,45),p:`R$${it.price}`,d:'Garimpo AUTO ML API'}));
    cacheProdutos.ml=lista;
   }
  }catch(e){cacheProdutos.ml=BANCO.ml[0];}

  // Shopee/TikTok rotação diária (API fechada)
  cacheProdutos.shopee=BANCO.shopee[getIndiceDiario(BANCO.shopee.length)];
  cacheProdutos.tiktok=BANCO.tiktok[getIndiceDiario(BANCO.tiktok.length)];

  localStorage.setItem('garimpo_guto_cache',JSON.stringify(cacheProdutos));
  localStorage.setItem('garimpo_guto_data',hoje);
  ultimaData=hoje;
 }else{
  if(!cacheProdutos.shopee) cacheProdutos.shopee=BANCO.shopee[0];
  if(!cacheProdutos.ml) cacheProdutos.ml=BANCO.ml[0];
  if(!cacheProdutos.tiktok) cacheProdutos.tiktok=BANCO.tiktok[0];
 }
 render();
}

function setTab(p){plataforma=p;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('t'+(p==='shopee'?'Shopee':p==='ml'?'ML':'Tik')).classList.add('active');render();}
function render(){
 let lista=cacheProdutos[plataforma]||[];
 let html='';
 lista.forEach((pr,i)=>{
  html+=`<div class="card"><span class="badge">${pr.b}: REQ OK | Verificada | Comissão Alta</span><br><b>${pr.n}</b><br><small>${pr.d}</small><br><span class="price">${pr.p}</span><br><button class="btn" onclick="copiarProduto(${i})">📋 COPIAR COM MEU ID ${plataforma.toUpperCase()}</button><button class="btn2" onclick="copiarZapProduto(${i})">📱 TEXTO ZAP AUTOMÁTICO</button></div>`;
 });
 document.getElementById('lista').innerHTML=html||'<p>Carregando garimpo...</p>';
}
function copiarProduto(i){
 let pr=cacheProdutos[plataforma][i];
 let link=plataforma==='shopee'?MEUS_LINKS.shopee:plataforma==='ml'?MEUS_LINKS.ml:MEUS_LINKS.tiktok;
 mostrar(link,`🔥 [AUTO GARIMPO] ${pr.n} por ${pr.p} - ${pr.b}`);
}
function copiarZapProduto(i){copiarProduto(i);setTimeout(copyZap,300);}
function gerarManual(){
 let url=document.getElementById('prod').value.trim();
 if(!url){alert('Cole link');return;}
 let final=plataforma==='shopee'?MEUS_LINKS.shopee:plataforma==='ml'?MEUS_LINKS.ml:url;
 mostrar(final,'🔥 ACHADINHO MANUAL');
}
function mostrar(link,titulo){
 document.getElementById('result').classList.remove('hide');
 document.getElementById('out').value=link;
 let texto=titulo+"\n\n👉 "+link+"\n\n✅ Requisitos: +1k vendas | -30% | 4.8★ | Loja Verificada | Alta Comissão | Frete Grátis";
 document.getElementById('zaptext').innerText=texto;
 window._zap=texto;
 document.getElementById('out').select();document.execCommand('copy');
}
function copyLink(){let el=document.getElementById('out');el.select();document.execCommand('copy');alert('COPIADO AUTO '+plataforma.toUpperCase());}
function copyZap(){navigator.clipboard.writeText(window._zap);alert('Texto Zap copiado!');}

garimparAuto();
</script>
</body>
</html>
